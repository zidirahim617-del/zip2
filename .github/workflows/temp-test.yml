name: temporary patch test

on:
  push:
    branches: [ci-test]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: test ${{ matrix.os }} ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: ["1.89", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update
      - run: rustup override set ${{ matrix.toolchain }}
      - run: rustc --version
      - name: no default features
        run: cargo test --no-default-features
      - name: default features
        if: ${{ !cancelled() }}
        run: cargo test
      - name: all features
        if: ${{ !cancelled() }}
        run: cargo test --all-features
      - name: zopfli only
        if: ${{ !cancelled() }}
        run: cargo test --no-default-features --features deflate-zopfli

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
      - run: rustup override set stable
      - name: fmt
        run: cargo fmt --check --all
      - name: clippy, all features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features
      - name: clippy, no default features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --no-default-features
      - name: clippy, default features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets
      - name: doc
        if: ${{ !cancelled() }}
        run: cargo doc --no-deps --all-features

  # The same tests on the commit before the patch, to tell old failures from new ones.
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: f275ac3f2fff7085d06820a9aac4e549105db33f
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - run: rustup override set stable
      - name: default features
        run: cargo test
      - name: all features
        if: ${{ !cancelled() }}
        run: cargo test --all-features
      - name: clippy, all features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features
